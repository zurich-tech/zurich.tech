name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
              with:
                  persist-credentials: false

            - name: Install Bun
              uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
              with:
                  bun-version: 1.3.3

            - name: Install just
              uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781
              with:
                  tool: just

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check
              run: just check
